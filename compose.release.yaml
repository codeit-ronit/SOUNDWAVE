# Standalone release candidate; never merge with the development compose.yaml.
x-runtime: &runtime
  env_file: ["${RUNTIME_ENV_FILE:?Set absolute protected runtime.env path}"]
  environment: &runtime-env
    NODE_ENV: production
    DATABASE_INIT: verify
    PRIVATE_MEDIA_ROOT: /app/private-media
    TRUSTED_PROXY_CIDRS: 172.29.240.2/32
    RELEASE_QUARANTINED: ${RELEASE_QUARANTINED:-true}
  init: true
  restart: on-failure:5
  volumes: ["private_media:/app/private-media"]
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }
services:
  postgres:
    image: postgres:18.6-trixie
    env_file: ["${POSTGRES_ENV_FILE:?Set absolute protected postgres.env path}"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    networks: [backend]
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soundwave"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      [
        "redis_data:/data",
        "${REDIS_CONFIG_FILE:?Set protected redis.conf path}:/usr/local/etc/redis/redis.conf:ro",
      ]
    networks: [backend]
    mem_limit: 128m
    cpus: 0.1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf) redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    profiles: [ops]
    image: soundwave:release-api
    build: { context: ., target: api }
    env_file: ["${MIGRATION_ENV_FILE:?Set protected migrator.env path}"]
    environment: { NODE_ENV: production, DATABASE_INIT: migrate }
    command: ["node", "server/scripts/migrate.js"]
    networks: [backend]
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 384m
    cpus: 0.5
    restart: "no"
  app:
    <<: *runtime
    image: soundwave:release-api
    build: { context: ., target: api }
    mem_limit: 384m
    cpus: 0.5
    networks:
      backend: {}
      edge: { ipv4_address: 172.29.240.3 }
    depends_on:
      {
        postgres: { condition: service_healthy },
        redis: { condition: service_healthy },
      }
  worker:
    <<: *runtime
    image: soundwave:release-worker
    build: { context: ., target: worker }
    mem_limit: 512m
    cpus: 0.75
    networks: [backend, egress]
    depends_on:
      {
        postgres: { condition: service_healthy },
        redis: { condition: service_healthy },
      }
  proxy:
    image: caddy:2-alpine
    environment:
      RELEASE_HOST: ${RELEASE_HOST:?Set approved hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact}
    volumes:
      [
        "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    ports: ["80:80", "443:443"]
    networks:
      edge: { ipv4_address: 172.29.240.2 }
    depends_on: [app]
    mem_limit: 96m
    cpus: 0.15
    restart: unless-stopped
networks:
  backend: { internal: true }
  edge:
    ipam:
      config: [{ subnet: 172.29.240.0/24 }]
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  private_media: {}
  caddy_data: {}
  caddy_config: {}
