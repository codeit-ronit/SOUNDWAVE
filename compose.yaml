x-app-environment: &app-environment
  NODE_ENV: ${APP_NODE_ENV:-development}
  PORT: 3001
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
  DATABASE_URL: postgres://soundwave:${POSTGRES_PASSWORD}@postgres:5432/soundwave
  DEMO_MODE: ${DEMO_MODE:-true}
  DB_POOL_MAX: 5
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: soundwave
  CATALOG_CACHE: ${CATALOG_CACHE:-false}
  EMAIL_MODE: ${EMAIL_MODE:-disabled}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-SoundWave <noreply@soundwave.local>}

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundwave
      POSTGRES_USER: soundwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwave -d soundwave"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  app:
    build: .
    image: soundwave:local
    init: true
    restart: on-failure:5
    environment: *app-environment
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    image: soundwave:local
    command: ["node", "server/scripts/worker.js"]
    init: true
    restart: on-failure:5
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
