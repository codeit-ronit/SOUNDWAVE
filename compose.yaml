x-app-environment: &app-environment
  NODE_ENV: ${APP_NODE_ENV:-development}
  RELEASE_QUARANTINED: ${RELEASE_QUARANTINED:-false}
  PORT: 3001
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
  DATABASE_URL: postgres://soundwave:${POSTGRES_PASSWORD}@postgres:5432/soundwave
  DEMO_MODE: ${DEMO_MODE:-true}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  PRIVATE_MEDIA_ROOT: /app/private-media
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  CREATOR_STORAGE_BYTES: ${CREATOR_STORAGE_BYTES:-52428800}
  PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-20}
  DERIVATIVE_MAX_BYTES: ${DERIVATIVE_MAX_BYTES:-8388608}
  PROCESSING_MEMORY_BYTES: ${PROCESSING_MEMORY_BYTES:-268435456}
  DB_POOL_MAX: 5
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: soundwave
  CATALOG_CACHE: ${CATALOG_CACHE:-true}
  MEDIA_JOBS: ${MEDIA_JOBS:-true}
  LIBRIVOX_CATALOG: ${LIBRIVOX_CATALOG:-true}
  EMAIL_MODE: ${EMAIL_MODE:-disabled}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-SoundWave <noreply@soundwave.local>}

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundwave
      POSTGRES_USER: soundwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwave -d soundwave"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
  app:
    build:
      context: .
      target: api
    image: soundwave:api
    mem_limit: 384m
    cpus: 1.0
    init: true
    restart: on-failure:5
    environment: *app-environment
    volumes:
      - private_media:/app/private-media
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      target: worker
    image: soundwave:worker
    mem_limit: 512m
    cpus: 1.0
    command: ["node", "server/scripts/worker.js"]
    init: true
    restart: on-failure:5
    environment: *app-environment
    volumes:
      - private_media:/app/private-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  private_media:
